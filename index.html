<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HIP-4 · 模拟盘实时看板</title>
<style>
:root{
 --bg:#f7f6f2; --card:#fff; --ink:#242016; --body:#3B352C; --muted:#8A7F6A;
 --line:#DFD4BC; --gold:#9A7A2E; --green:#1e8449; --red:#b02318;
 --th:#F5F1E7; --rule:#f1ede3;
 --sans:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',-apple-system,sans-serif;
 --mono:Consolas,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
 -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding:24px 22px 40px}

/* header */
.head{border-bottom:2px solid var(--ink);padding-bottom:14px;display:flex;
 align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.kicker{font-size:10.5px;letter-spacing:3px;color:var(--gold);font-weight:700}
h1{font-size:23px;margin:7px 0 0;font-weight:700;letter-spacing:.5px;line-height:1.25}
.headmeta{text-align:right;font-size:11.5px;color:var(--muted);line-height:1.85;white-space:nowrap}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-weight:700}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);
 box-shadow:0 0 0 3px rgba(30,132,73,.14);animation:pulse 2s infinite}
.dot.stale{background:var(--red);box-shadow:0 0 0 3px rgba(176,35,24,.14)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* tabs */
.tabs{display:flex;gap:8px;margin:18px 0 16px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;font-family:inherit;font-size:13.5px;font-weight:700;
 color:var(--muted);padding:9px 18px 11px;cursor:pointer;border-bottom:2px solid transparent;
 margin-bottom:-1px;letter-spacing:.5px}
.tab.on{color:var(--ink);border-bottom-color:var(--gold)}

/* summary cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:15px 17px}
.lbl{font-size:11px;color:var(--muted);letter-spacing:.6px}
.big{font-family:var(--mono);font-size:25px;font-weight:700;line-height:1.15;margin:7px 0 3px}
.big.red{color:var(--red)} .big.green{color:var(--green)} .big.gold{color:var(--gold)}
.sub{font-size:10.5px;color:var(--muted);line-height:1.5}

/* sections */
section{background:var(--card);border:1px solid var(--line);border-radius:2px;
 padding:17px 19px;margin-bottom:14px}
h2{font-size:14px;margin:0 0 12px;font-weight:700;letter-spacing:.5px;
 display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 em{font-style:normal;font-size:10.5px;color:var(--muted);font-weight:400}
.rule{background:var(--rule);border-left:3px solid var(--gold);padding:11px 15px;
 font-size:12px;line-height:1.9;color:var(--body);margin-bottom:14px}
.rule b{color:var(--ink)}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:520px}
.wide table{min-width:880px}
th{text-align:left;color:var(--muted);font-weight:500;background:var(--th);
 border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 9px;white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid #f0ede6;white-space:nowrap}
tr:last-child td{border-bottom:0}
.sid{font-family:var(--mono);font-size:11.5px;color:var(--ink)}
.num{text-align:right;font-family:var(--mono)}
.pos{color:var(--green);font-weight:700} .neg{color:var(--red)}
/* 实盘逐笔明细（优秀池页签内嵌） */
details.lg{border:1px solid var(--line);border-radius:3px;margin-bottom:8px;background:var(--card);overflow:hidden}
details.lg summary{cursor:pointer;user-select:none;padding:10px 14px;background:#FBF9F3;font-size:12.5px;list-style:none}
details.lg summary::-webkit-details-marker{display:none}
details.lg summary:before{content:'▶ ';color:var(--muted);font-size:10px}
details.lg[open] summary:before{content:'▼ '}
details.lg summary:hover{background:#F5F1E7}
details.lg .wide{padding:6px 10px 10px}
.tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:9px;font-weight:700}
.tag.win{background:#E8F5EE;color:var(--green)} .tag.loss{background:#FDEAE7;color:var(--red)} .tag.open{background:#FFF6DD;color:var(--gold)}
.rk{font-family:var(--mono);color:var(--muted);width:28px}

/* gate */
.gate{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.gi{border:1px solid var(--line);border-radius:2px;padding:11px 13px;background:#fdfcf9}
.gi .k{font-size:10.5px;color:var(--muted)}
.gi .v{font-family:var(--mono);font-size:17px;font-weight:700;margin-top:4px}
.ok{color:var(--green)} .no{color:var(--red)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.err{background:#fdf3f1;border:1px solid #e8c9c2;color:var(--red);
 padding:12px 15px;font-size:12.5px;border-radius:2px;margin-bottom:14px}
.foot{border-top:1px solid var(--line);padding-top:12px;margin-top:16px;
 font-size:10.5px;color:var(--muted);line-height:1.85}
.loading{color:var(--muted);font-size:12.5px;padding:20px 0}

/* single-100 campaign */
.bar{height:6px;background:#EFEADI;border:1px solid var(--line);position:relative;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold)}
.barlbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin:6px 0 2px}
.spark{background:#FCFAF4;border:1px solid var(--line);padding:8px 10px 4px;margin-top:4px}
.strat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.si{border:1px solid var(--line);background:#fdfcf9;padding:10px 12px}
.si .k{font-size:10px;color:var(--muted)}
.si .v{font-size:12px;font-weight:700;margin-top:4px;font-family:var(--mono)}

@media(max-width:760px){
 .wrap{padding:16px 13px 30px}
 h1{font-size:19px}
 .headmeta{text-align:left;white-space:normal;font-size:11px}
 .head{align-items:flex-start;flex-direction:column;gap:8px}
 .cards{grid-template-columns:repeat(2,1fr);gap:9px}
 .big{font-size:21px}
 .card{padding:12px 13px}
 section{padding:14px 13px}
 .grid2{grid-template-columns:1fr}
 .gate{grid-template-columns:repeat(2,1fr)}
 .tab{padding:9px 12px;font-size:12.5px}
}
/* 专注主屏与旧版收起 */
.tabs{flex-wrap:wrap;align-items:center}
.tabs.legacy-hidden .legacy-tab{display:none!important}
.tab.toggle-legacy{margin-left:auto;font-weight:500;font-size:12px;color:var(--muted)}
.fbar-row{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:var(--card);border:1px solid var(--line);
 border-radius:2px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--body)}
.fbar-row b{color:var(--ink)}
.fdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:1px}
.fdot.bad{background:var(--red)} .fdot.warn{background:var(--gold)}
.pbox{padding:10px 0 12px}
.pbar-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--body)}
.pbar-head b{color:var(--ink)}
.pbar{height:7px;background:#EFEADI;border:1px solid var(--line);margin:7px 0;overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--gold)}
.tag.sell{background:#EEF3FA;color:#1F5F99}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'—':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n = (v,d=0) => (v==null?'—':Number(v).toFixed(d));
const sign = (v,d=2) => (v==null?'—':(v>=0?'+':'')+Number(v).toFixed(d));
const cls = v => v==null?'':(v>=0?'pos':'neg');
let S=null, PANEL=(new URLSearchParams(location.search)).get('p')||'focus', SHOW_LEGACY=false;

function cards(items){
 return '<div class="cards">'+items.map(i=>
  `<div class="card"><div class="lbl">${esc(i.l)}</div>
   <div class="big ${i.c||''}">${i.v}</div><div class="sub">${esc(i.s||'')}</div></div>`).join('')+'</div>';
}
function table(cols,rows,empty){
 if(!rows||!rows.length) return `<div class="loading">${esc(empty||'暂无数据')}</div>`;
 return `<div class="tw"><table><thead><tr>${cols.map(c=>`<th class="${c.num?'num':''}">${esc(c.t)}</th>`).join('')}</tr></thead>
  <tbody>${rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${cols[i].num?'num':''} ${cols[i].cls&&cols[i].cls(v)}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function section(title,em,body){return `<section><h2>${esc(title)}<em>${esc(em||'')}</em></h2>${body}</section>`;}

function panelM15(){
 const d=S.m15, c=[
  {l:'全场合计已实现盈亏',v:sign(d.pnl,2)+' <span style="font-size:12px;font-weight:400">USDC</span>',c:cls(d.pnl),s:'含全部参数穷举账户，非主推组合'},
  {l:'独立到期合约',v:n(d.exps),c:'gold',s:`结算 ${n(d.settles)} 笔 · 约 ${n(d.mult)} 倍重复押注`},
  {l:'胜率',v:n(d.win,1)+'%',s:`盈利策略 ${n(d.pos_sid)} / 亏损 ${n(d.neg_sid)}`},
  {l:'样本跨度',v:n(d.hours)+' 小时',s:`参与策略 ${n(d.sids)} 个 · 笔均 ${sign(d.per_trade,2)}`},
 ];
 const top=table(
  [{t:'策略版本'},{t:'已实现盈亏',num:1,cls:v=>cls(parseFloat(v))},{t:'独立到期',num:1},{t:'胜率',num:1},{t:'t 值',num:1}],
  (d.top||[]).map(r=>[`<span class="sid">${esc(r.sid)}</span>`,`<span class="${cls(r.pnl)}">${sign(r.pnl)}</span>`,n(r.ind),n(r.win,1)+'%',n(r.t,2)]),
  '盈利榜暂无数据');
 const cand=table(
  [{t:'策略版本'},{t:'独立到期',num:1},{t:'跨小时',num:1},{t:'模拟盈亏',num:1,cls:v=>cls(parseFloat(v))},{t:'t 值',num:1}],
  (d.candidates||[]).map(r=>[`<span class="sid">${esc(r.sid)}</span>`,n(r.ind),n(r.hours),`<span class="${cls(r.pnl)}">${sign(r.pnl)}</span>`,n(r.t,2)]),
  '当前无满足门槛的候选');
 const rule=`<div class="rule"><b>口径</b>　结算笔数含同一到期结果被多账户重复押注的部分，判定以独立到期数为准。
  15 分钟盘全场为负源于参数穷举账户占多数，评估主推版本应参照盈利榜。候选仅为观察名单，不构成上实盘结论。</div>`;
 return cards(c)+rule+
   section('盈利榜 · 前 5','按已实现盈亏排序',top)+
   section('当前候选池','独立到期 ≥100 且 t ≥1.65',cand);
}

function panelDaily(){
 const d=S.daily, c=[

function spark(pts,base){
 if(!pts||pts.length<2) return `<div class="loading">权益曲线采集中，稍后刷新</div>`;
 const vs=pts.map(p=>Number(p[1]||0)), lo=Math.min(base,...vs)-2, hi=Math.max(base,...vs)+2;
 const W=1000,H=170,L=44,R=10,T=10,B=20;
 const xy=(i,v)=>[L+(W-L-R)*i/Math.max(1,vs.length-1), T+(H-T-B)*(1-(v-lo)/(hi-lo))];
 const line=vs.map((v,i)=>xy(i,v).map(x=>x.toFixed(1)).join(',')).join(' ');
 const area=`${L},${H-B} ${line} ${xy(vs.length-1,vs[vs.length-1])[0].toFixed(1)},${H-B}`;
 const col=vs[vs.length-1]>=base?'var(--red)':'var(--green)';
 const by=xy(0,base)[1].toFixed(1);
 let g='';for(let k=0;k<4;k++){g+=`<text x="${L-6}" y="${(T+(H-T-B)*k/3+4).toFixed(0)}" text-anchor="end" font-size="9" fill="var(--muted)" font-family="var(--mono)">${(hi-(hi-lo)*k/3).toFixed(0)}</text>`}
 return `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
  <rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="#FCFAF4"/>
  ${g}<line x1="${L}" y1="${by}" x2="${W-R}" y2="${by}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,4" opacity=".7"/>
  <polygon points="${area}" fill="${col}" opacity=".08"/>
  <polyline points="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
  <text x="${L}" y="${H-5}" font-size="9" fill="var(--muted)" font-family="var(--mono)">${esc((pts[0][0]||'').slice(5,16))}</text>
  <text x="${W-R}" y="${H-5}" text-anchor="end" font-size="9" fill="var(--muted)" font-family="var(--mono)">${esc((pts[pts.length-1][0]||'').slice(5,16))}</text></svg>`;
}

  按档位逐档吃挂单、整股取整，吃到 10 USDC 才算成交，上限 11；限价单量按策略自己的最高买价挂，成交价是吃到的加权均价。

  <br><b>怎么读</b>　理想盘（左）是停跑前的冻结基线，同构盘（右）是现在唯一在跑的 100 元盘；差额就是"纸面价与真实成交"的差，差额越大，理想盘的收益越不可信。

 return cards(c)+gapBlock+rule+section('策略对照 · 前 24','左侧理想价成交，右侧实盘同构成交',`<div class="wide">${rank}</div>`);
}

const QS = location.search || '';
function paint(data,online){

 const stale=age>1800;
 $('#dot').className='dot'+(stale?' stale':'');
 $('#livetxt').textContent=online?(stale?'数据延迟':'实时'):'内嵌快照';
 $('#livetxt').style.color=online?(stale?'var(--red)':'var(--green)'):'var(--muted,#888)';
 render();
}

async function tick(){
 try{
  // 内嵌数据已保证首屏可见；这里只做在线刷新，失败也保留内嵌数据
  let S2=null;
  const bust='t='+Date.now();
  const localUrl='snapshot.json?'+(QS?QS.slice(1)+'&':'')+bust;
  const cdnUrl='https://cdn.jsdelivr.net/gh/conquerli80/hip4-pages@main/snapshot.json?'+bust;
  for(const url of [localUrl,cdnUrl,'/api/snapshot'+QS]){
   try{
    const r=await fetch(url,{cache:'no-store'});
    if(r.ok){ const j=await r.json(); if(j&&j.as_of){ S2=j; break; } }
   }catch(_){}
  }
  if(!S2) return;  // 拿不到在线数据就保持内嵌快照，不报错
  // 只有在线数据更新才重绘
  if(S2._pushed_at && S._pushed_at && S2._pushed_at<=S._pushed_at) return;
  paint(S2,true);
 }catch(e){
  // 在线刷新失败无妨，首屏内嵌数据已在，保持显示即可
 }
}
document.querySelectorAll('.tab[data-p]').forEach(b=>b.onclick=()=>{
