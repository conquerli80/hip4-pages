h2{font-size:15px;margin:0 0 13px;font-weight:700;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 em{font-size:11px;color:var(--muted);font-style:normal;font-weight:400}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--rule);white-space:nowrap}
th{background:var(--th);color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.4px}
td.num,th.num{text-align:right;font-family:var(--mono)}
td.wraptxt{white-space:normal;min-width:220px;max-width:340px;font-size:11.5px;color:var(--body)}
.badge{display:inline-block;font-size:10px;padding:1px 7px;border-radius:9px;
 background:#eef2f7;color:#1f5f99;font-weight:700;margin-left:6px}
.badge.win{background:#e8f5ee;color:var(--green)}
.badge.loss{background:#fdeae7;color:var(--red)}
.badge.open{background:#fff6dd;color:var(--gold)}
.badge.idle{background:#f1ede3;color:var(--muted)}
.strat{background:var(--card);border:1px solid var(--line);border-radius:2px;margin-bottom:14px;overflow:hidden}
.strat .sh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
 padding:12px 18px;background:#fbf9f3;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.strat .sn{font-family:var(--mono);font-weight:700;font-size:14px}
.strat .sp{font-size:11.5px;color:var(--muted);margin-top:2px}
.strat .sk{font-size:11.5px;font-family:var(--mono);display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.strat .sk b{font-size:14px}
.strat .arrow{color:var(--muted);font-size:11px;transition:transform .2s}
.strat.open .arrow{transform:rotate(90deg)}
.strat .sbody{display:none;padding:10px 18px 14px}
.strat.open .sbody{display:block}
.foot{font-size:11px;color:var(--muted);line-height:1.8;margin-top:8px}
.spark{display:flex;align-items:flex-end;gap:1px;height:56px;margin-top:8px;padding:8px 10px;
 background:#FCFAF4;border:1px solid var(--line)}
.spark i{flex:1 1 2px;background:#C9B98A;min-width:1px}
.subsec{margin:18px 0 10px;padding-top:12px;border-top:2px solid var(--line)}
.rejline{font-size:11.5px;color:var(--muted);margin-top:8px;font-family:var(--mono)}
.empty{color:var(--muted);font-size:12px;padding:10px 0}
@media(max-width:860px){.sum{grid-template-columns:repeat(2,1fr)}.headmeta{text-align:left}}

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'—':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = (v,d=2)=> (v==null||v===''?'—':Number(v).toFixed(d));
const sgn = (v,d=2)=> (v==null?'—':(v>=0?'+':'')+Number(v).toFixed(d));
const clz = v => v==null?'':(v>=0?'pos':'neg');
const fT = ms => { if(!ms) return '—';
  const d=new Date(ms); const p=n=>String(n).padStart(2,'0');
  return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const fIso = s => { if(!s) return '—';
  const d=new Date(s); if(isNaN(d)) return String(s).slice(0,19);
  const p=n=>String(n).padStart(2,'0');
  return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; };

function label(t){
  if(t.perp) return t.perp + (t.expiry? ' · '+t.expiry : '');
  return (t.coin||('oid '+t.oid));
}
function agg(trades){
  const a={n:0,w:0,l:0,pnl:0,cost:0};
  trades.forEach(t=>{ a.n++;
    if(t.status!=='settled') return;
    a.pnl+=t.pnl||0;
    if(t.result==='win')a.w++; else if(t.result==='loss')a.l++;
  });
  return a;
}

      <td class="num">${a.n}</td><td class="num ${clz(a.pnl)}">${sgn(a.pnl)}</td>
    </tr>`;
  }).join('');
  $('#rankbody').innerHTML=rows+rows2;
})();

/* 真钱策略卡片：每组逐笔明细 */
(function(){
  const g=(DATA.groups||[]).map(gr=>{
    const a=agg(gr.trades);
    const wr=a.n? Math.round(a.w/a.n*1000)/10 : null;
    const rows=gr.trades.map(t=>{
      const tag=t.status!=='settled'?'open':(t.result==='win'?'win':'loss');
      const zh=t.status!=='settled'?'持仓':(t.result==='win'?'赢':'输');
      return `<tr>
        <td class="mono">${fT(t.open_ms)}</td>
        <td class="mono">${t.settle_ms?fT(t.settle_ms):'—'}</td>
        <td class="mono">${esc(label(t))}</td>
        <td><b>买${esc(t.side)}</b></td>
        <td class="num">${num(t.fill_px,5)}</td>
        <td class="num">${num(t.qty,0)}</td>
        <td class="num">${num(t.cost)}</td>
        <td class="num">${t.settle_px!=null?num(t.settle_px,4):'—'}</td>
        <td class="num ${t.status==='settled'?clz(t.pnl):''}">${t.status==='settled'?sgn(t.pnl):'—'}</td>
        <td><span class="badge ${tag}">${zh}</span></td>
      </tr>`;
    }).join('');
    return `<div class="strat open" id="g-${esc(gr.sid)}">
      <div class="sh" onclick="this.parentNode.classList.toggle('open')">
        <div><div class="sn">${esc(gr.sid)}</div>
          <div class="sp">点击展开 / 收起逐笔明细</div></div>
        <div class="sk">
          <span>实盘 <b>${a.n}</b> 笔</span>
          <span>赢 <b class="pos">${a.w}</b> / 输 <b class="neg">${a.l}</b></span>
          <span>胜率 <b>${wr==null?'—':wr+'%'}</b></span>
          <span>净盈亏 <b class="${clz(a.pnl)}">${sgn(a.pnl)}U</b></span>
          <span class="arrow">▶</span>
        </div>
      </div>
      <div class="sbody"><div class="tw"><table>
        <thead><tr><th>开仓</th><th>结算</th><th>标的</th><th>方向</th>
        <th class="num">成交价</th><th class="num">张数</th><th class="num">成本</th>
        <th class="num">结算价</th><th class="num">净盈亏</th><th>结果</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div></div>
    </div>`;
  }).join('');
  $('#strats').innerHTML=g||'<div class="empty">暂无分组数据</div>';
})();

$('#foot').innerHTML=esc(DATA.note||'')+
 '<br>数据来源：Hyperliquid 官方 userFills 配对（买入开仓 + 官方结算）+ ELITE-LAB 本地 1:1 实盘同构引擎。模拟榜为对照与前瞻迭代，不构成收益承诺。';
</script>
</body>
</html>
